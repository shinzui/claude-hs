name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cabal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix develop --accept-flake-config --no-write-lock-file -c cabal update
      - run: nix develop --accept-flake-config --no-write-lock-file -c cabal build all
      - run: nix develop --accept-flake-config --no-write-lock-file -c cabal test all --test-show-details=direct
      - run: >-
          nix run --accept-flake-config --no-write-lock-file --inputs-from . okf#okf-cli --
          validate docs/friction-log --strict --profile docs/friction-log/profile.dhall
          --profile-enforce --log-enforce
